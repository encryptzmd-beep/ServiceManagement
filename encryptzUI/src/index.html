<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Encryptz ERP</title>
  <base href="/">
  <!--
    Content Security Policy (XSS defence). Scripts: this origin + unpkg (Leaflet, loaded on
    demand by LeafletLoaderService). No inline scripts / inline event handlers are allowed.
    connect-src must cover environment.apiUrl; frame-ancestors cannot be set from a meta
    tag and is sent by the web server (deploy/nginx/security-headers.conf).
  -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https: http://localhost:* ws://localhost:*; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet">

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@300;400;500;600&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
    rel="stylesheet">

</head>

<body>

</body>

</html>
