<header class="header">
  <div class="header-left">
    <button class="menu-toggle" (click)="toggleSidebar.emit()">
      <span class="material-icons">menu</span>
    </button>
    <div class="brand">
  <span class="brand-text">
    {{ companyName }}
    <span class="brand-accent">{{ companySuffix }}</span>
  </span>
  @if (branchName) {
    <span class="brand-branch">· {{ branchName }}</span>
  }
</div>
  </div>

  <!-- <div class="header-center">
    <div class="search-box">
      <span class="material-icons search-icon">search</span>
      <input type="text" placeholder="Search complaints, customers..." class="search-input" />
    </div>
  </div> -->

  <div class="header-right">
    <app-wallet-chip />
    <app-notification-bell />
    <div class="user-menu" (click)="showDropdown = !showDropdown">
      <div class="avatar">{{ initials }}</div>
      <div class="user-info">
        <span class="user-name">{{ auth.userName() }}</span>
        <span class="user-role">{{ auth.userRole() }}</span>
      </div>
      <span class="material-icons">expand_more</span>
    </div>
    @if (showDropdown) {
    <div class="dropdown" (click)="showDropdown = false">
      <a routerLink="/profile" class="dropdown-item">
        <span class="material-icons">person</span> Profile
      </a>
      <a routerLink="/select-branch" [queryParams]="{ module: auth.selectedModuleKey() }" class="dropdown-item">
        <span class="material-icons">storefront</span> Switch branch
      </a>
      <a routerLink="/select-module" class="dropdown-item">
        <span class="material-icons">apps</span> Modules
      </a>
      <a routerLink="/select-company" class="dropdown-item">
        <span class="material-icons">apartment</span> Switch company
      </a>
      <a class="dropdown-item" (click)="auth.logout()">
        <span class="material-icons">logout</span> Logout
      </a>
    </div>
    }
  </div>
</header>
