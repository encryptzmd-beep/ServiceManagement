<div class="crm-layout">
  <app-header (toggleSidebar)="dash.toggleSidebar()" />

  <aside class="crm-side" [class.collapsed]="!dash.sidebarOpen()" [class.mobile-open]="dash.sidebarOpen()" aria-label="CRM">
    <div class="side-header">
      <span class="side-brand"></span>
      <button type="button" class="side-toggle" (click)="dash.toggleSidebar()" title="Toggle sidebar">
        <span class="material-icons">{{ dash.sidebarOpen() ? 'menu_open' : 'menu' }}</span>
      </button>
    </div>

    <nav class="side-nav">
      <div class="nav-section">
        @for (item of menu; track item.path) {
          <a class="nav-item" [routerLink]="item.path" routerLinkActive="active" [title]="item.label">
            <span class="material-icons nav-icon">{{ item.icon }}</span>
            <span class="nav-label">{{ item.label }}</span>
          </a>
        }
        <div class="nav-group" [class.expanded]="reportsOpen()">
          <button type="button" class="nav-item nav-group-header" [class.active]="reportsActive()" title="Reports"
            [attr.aria-expanded]="reportsOpen()" (click)="toggleReports()">
            <span class="material-icons nav-icon">bar_chart</span>
            <span class="nav-label">Reports</span>
            <span class="material-icons nav-arrow" aria-hidden="true">{{ reportsOpen() ? 'expand_less' : 'expand_more' }}</span>
          </button>
          @if (reportsOpen()) {
            <div class="nav-children">
              @for (r of reports; track r.key) {
                <a class="nav-item child" [routerLink]="['/crm/reports', r.key]" routerLinkActive="active" [title]="r.label">
                  <span class="material-icons nav-icon child-icon">{{ r.icon }}</span>
                  <span class="nav-label">{{ r.label }}</span>
                </a>
              }
            </div>
          }
        </div>
        @if (isManager()) {
          <a class="nav-item" routerLink="/crm/settings" routerLinkActive="active" title="Settings">
            <span class="material-icons nav-icon">settings</span>
            <span class="nav-label">Settings</span>
          </a>
        }
      </div>

      <div class="side-footer">
        <div class="env-badge">v1.0.0 • Dev</div>
      </div>
    </nav>
  </aside>

  @if (dash.sidebarOpen()) {
    <div class="crm-backdrop" (click)="dash.closeSidebar()"></div>
  }

  <main class="crm-main" [class.sidebar-open]="dash.sidebarOpen()">
    <div class="crm-content"><router-outlet /></div>
    <app-footer />
  </main>
</div>
