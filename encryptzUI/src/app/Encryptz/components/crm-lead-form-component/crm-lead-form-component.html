@if (error() === forbidden) {
  <app-crm-refused />
} @else {
  <div class="crm-page lf-page">
    <header class="lf-head">
      <nav class="lf-crumb" aria-label="Breadcrumb"><a routerLink="/crm/leads">Leads</a><span aria-hidden="true">/</span></nav>
      <h1>{{ form().leadId ? 'Change lead' : 'New lead' }}</h1>
    </header>

    <app-transaction-toolbar
      [mode]="form().leadId ? 'edit' : 'new'" [label]="form().leadId ? leadNo() : ''" [status]="''"
      [canEdit]="false" [canSave]="true" [canCancel]="false" [previousId]="null" [nextId]="null" [busy]="saving()"
      (newDoc)="onNew()" (discard)="cancel()" (save)="save()" (find)="onFind()" />

    @if (findOpen()) {
      <app-transaction-find title="Find a lead" placeholder="Name, mobile, city or lead no."
        [rows]="findRows()" [loading]="findLoading()"
        (search)="onFindSearch($event)" (pick)="onFindPick($event)" (close)="findOpen.set(false)" />
    }

    @if (error()) { <p class="crm-error lf-error" role="alert">{{ error() }}</p> }

    <form class="lf-form" (ngSubmit)="save()">
      <app-crm-lead-fields [form]="form()" [sources]="sources()" [owners]="owners()" [isManager]="isManager()"
        [productName]="productName()" [leadNo]="leadNo()"
        (changed)="set($any($event.key), $event.value)" (productPicked)="productName.set('')" />
      <button type="submit" class="lf-hidden-submit" tabindex="-1" aria-hidden="true">Save</button>
    </form>
  </div>
}
