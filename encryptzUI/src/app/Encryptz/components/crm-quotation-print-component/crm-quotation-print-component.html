@if (error() === forbidden) {
  <app-crm-refused />
} @else if (error()) {
  <p class="qp-error">{{ error() }}</p>
} @else if (!document()) {
  <p class="qp-loading">Loading…</p>
} @else {
  <div class="qp-bar">
    <a [routerLink]="['/crm/quotations', id]">Back to the quotation</a>
    <span class="qp-actions">
      <button type="button" class="secondary" [disabled]="pdfBusy()" (click)="downloadPdf()">{{ pdfBusy() ? 'Preparing…' : 'Download PDF' }}</button>
      <button type="button" (click)="print()">Print</button>
    </span>
  </div>
  @if (pdfError()) { <p class="qp-error" role="alert">{{ pdfError() }}</p> }
  <div class="qp-paper">
    <app-document-print [doc]="document()!" [settings]="settings()" [company]="companyInfo()" />
  </div>
}
