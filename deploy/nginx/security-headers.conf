# =============================================================================
# erp.encryptz.in · security headers + compression for the Angular app
# -----------------------------------------------------------------------------
# Include inside the HTTPS `server { ... }` block of the site:
#
#     include /etc/nginx/snippets/security-headers.conf;
#
# then:  nginx -t && systemctl reload nginx
#
# NOTE: nginx drops inherited add_header lines in any `location` that has its own
# add_header. If a location of the site sets headers itself, include this file
# there as well.
# =============================================================================

# SEC-006 · no "nginx/1.18.0 (Ubuntu)" in the Server header and error pages
server_tokens off;

# SEC-001 · HTTPS only for a year (send on the HTTPS server block only)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# SEC-003 · the portal may not be framed by other sites (clickjacking)
add_header X-Frame-Options "SAMEORIGIN" always;
# SEC-002 · the rest of the Content-Security-Policy ships in the app's index.html
#           (meta tag); frame-ancestors is only honoured as a response header
add_header Content-Security-Policy "frame-ancestors 'self'" always;

# SEC-004 · no MIME sniffing
add_header X-Content-Type-Options "nosniff" always;

# SEC-005
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# PERF-001 · gzip for the JS / CSS bundles (text/html is always compressed and must
#            not be listed). The bundles were served raw: ~535 KB per cold load.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml
    text/plain
    text/xml
    application/xml
    font/ttf
    font/otf;
